services:
  db:
    image: postgres:17-alpine
    container_name: drawmap-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: drawmap
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d drawmap"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: drawmap-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=drawmap;Username=postgres;Password=postgres"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
